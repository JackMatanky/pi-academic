# academic-writer — dev toolchain, managed by mise (https://mise.jdx.dev)
#
# `mise install` provisions the pinned Node/Python versions; the postinstall
# hook then bootstraps both npm trees (root + extensions/) and the Python
# venv's pip dependencies, so a fresh clone is ready for `mise run test` /
# `mise run typecheck` with one command.
#
# Note: this does NOT manage zotero-mcp (`pip install zotero-mcp-server`) —
# that's an end-user runtime dependency of the *installed* pi package
# (see README.md "Quick Start"), not this repo's own dev/build toolchain.

[tools]
node = "26"    # matches package.json engines (>=20) and extensions/@types/node ^26
python = "3.12"

[env]
# Creates/activates .venv on `mise activate`/`mise exec`/`mise run`, using the
# pinned Python above. If `uv` is present on the machine, mise uses it to
# create the venv — `uv venv` does NOT seed pip by default, so `uv_create_args
# = ["--seed"]` requests it explicitly (a no-op when the stdlib `python -m
# venv` fallback is used instead, since `--upgrade-deps` covers pip there).
_.python.venv = { path = ".venv", create = true, python_create_args = ["--upgrade-deps"], uv_create_args = ["--seed"] }

[tasks.setup]
description = "Install npm deps (root + extensions/) and pip requirements"
run = [
  "npm install",
  "npm --prefix extensions install",
  "{{config_root}}/.venv/bin/pip install -r requirements.txt",
]

[tasks.test]
description = "Run the Python test suite"
alias = "t"
run = "{{config_root}}/.venv/bin/python3 -m pytest tests/"

[tasks.typecheck]
description = "Strict TypeScript check on extensions/"
run = "npm run typecheck"

[tasks.ci]
description = "Everything CI-equivalent: typecheck + tests"
depends = ["typecheck", "test"]

[tasks.install-hooks]
description = "Install the git pre-push hook that runs the test suite (run once after cloning)"
run = "bash scripts/install-hooks.sh"

[hooks]
# Runs after `mise install` provisions node/python (including on a no-op
# install), so dependencies stay in sync whenever the pinned versions change.
postinstall = { task = "setup" }

