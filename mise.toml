# academic-writer — dev toolchain, managed by mise (https://mise.jdx.dev)
#
# `mise install` provisions Node/uv/Python; the postinstall hook then
# bootstraps both npm trees (root + extensions/) and syncs the uv-managed
# Python environment (pyproject.toml + uv.lock), so a fresh clone is ready
# for `mise run test` / `mise run typecheck` with one command.
#
# Note: this does NOT manage zotero-mcp (`pip install zotero-mcp-server`) —
# that's an end-user runtime dependency of the *installed* pi package
# (see README.md "Quick Start"), not this repo's own dev/build toolchain.

[tools]
node = "26"    # matches package.json engines (>=20) and extensions/@types/node ^26
python = "3.12"
uv = "latest"

[settings]
# Sources the .venv that `uv sync`/`uv run` manage via pyproject.toml +
# uv.lock (mise locates the project by walking up for uv.lock). "create|source"
# creates the venv if missing, then activates it on mise activate/exec.
python.uv_venv_auto = "create|source"

[env]
# Point uv at mise's pinned Python interpreter instead of letting it
# download its own copy of the same version.
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.setup]
description = "Install npm deps (root + extensions/) and sync Python deps via uv"
run = [
  "npm install",
  "npm --prefix extensions install",
  "uv sync",
]

[tasks.test]
description = "Run the Python test suite"
alias = "t"
run = "uv run pytest tests/"

[tasks.typecheck]
description = "Strict TypeScript check on extensions/"
run = "npm run typecheck"

[tasks.ci]
description = "Everything CI-equivalent: typecheck + tests"
depends = ["typecheck", "test"]

[tasks.install-hooks]
description = "Install the git pre-push hook that runs the test suite (run once after cloning)"
run = "bash scripts/install-hooks.sh"

[hooks]
# Runs after `mise install` provisions node/uv/python (including on a no-op
# install), so dependencies stay in sync whenever the pinned versions change.
postinstall = { task = "setup" }
