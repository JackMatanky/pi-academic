# academic-writer — dev toolchain, managed by mise (https://mise.jdx.dev)
#
# `mise install` provisions Node/hk/taplo; the postinstall hook then bootstraps
# the npm trees (root + extensions/), so a fresh clone is ready for
# `mise run lint` / `mise run test` with one command.
#
# Note: this does NOT manage zotero-mcp (`pip install zotero-mcp-server`) —
# that's an end-user runtime dependency of the *installed* pi package
# (see README.md "Quick Start"), not this repo's own dev/build toolchain.

[tools]
node = "26"      # satisfies package.json engines (>=22.19) and extensions/@types/node ^26
hk = "latest"
taplo = "latest"

[tasks.setup]
description = "Install npm deps (root + extensions/)"
run = ["npm install", "npm --prefix extensions install"]

[tasks.fmt]
description = "Format TypeScript, JSON, YAML, and TOML; apply Oxlint autofixes"
run = [
  "npx oxlint --fix extensions",
  "npx oxfmt --write \"**/*.{ts,js,json,yml,yaml}\"",
  "taplo format mise.toml",
]

[tasks.fmt-check]
description = "Check formatting without changing files"
run = [
  "npx oxfmt --check \"**/*.{ts,js,json,yml,yaml}\"",
  "taplo check mise.toml",
]

[tasks.lint]
description = "Lint TypeScript (Oxlint + anti-slop, tsc), and check formatting"
run = ["mise run fmt-check", "npx oxlint extensions", "npm run typecheck"]

[tasks.test]
description = "Run the TypeScript test suite"
alias = "t"
run = ["npm --prefix extensions run test"]

[tasks.typecheck]
description = "Strict TypeScript check on extensions/"
run = "npm run typecheck"

[tasks.ci]
description = "Everything CI-equivalent: lint + tests"
depends = ["lint", "test"]

[tasks.install-hooks]
description = "Install hk git hooks for this repo (run once after cloning)"
run = "hk install"

[hooks]
# Runs after `mise install` provisions node/hk/taplo (including on a no-op
# install), so dependencies stay in sync whenever the pinned versions change.
postinstall = { task = "setup" }
